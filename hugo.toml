baseURL = "https://koriebruh.github.io/doc-go-snap-bi/"
title = "go-snap-bi"
theme = "github.com/imfing/hextra"
defaultContentLanguage = "en"
enableRobotsTXT = true
enableInlineShortcodes = true

[markup]
  [markup.highlight]
    noClasses = false
  [markup.goldmark.renderer]
    unsafe = true

[module]
  [[module.imports]]
    path = "github.com/imfing/hextra"

[languages]
  [languages.en]
    label = "English"
    weight = 1
  [languages.id]
    label = "Bahasa Indonesia"
    weight = 2

[menu]
  [[menu.main]]
    name = "Documentation"
    pageRef = "/docs"
    weight = 1
  [[menu.main]]
    name = "FAQ"
    pageRef = "/docs/concepts/faq"
    weight = 2
  [[menu.main]]
    name = "GitHub"
    url = "https://github.com/koriebruh/go-snap-bi"
    weight = 3
    [menu.main.params]
      icon = "github"
  [[menu.main]]
    name = "Search"
    weight = 4
    [menu.main.params]
      type = "search"
  [[menu.main]]
    name = "Language"
    weight = 5
    [menu.main.params]
      type = "language-switch"
  [[menu.main]]
    name = "Theme"
    weight = 7
    [menu.main.params]
      type = "theme-toggle"

[params]
  description = "A Go implementation of Bank Indonesia's SNAP payment standard."

  [params.theme]
    default = "light"
    displayToggle = true

  [params.page]
    width = "full"

  [params.navbar]
    displayTitle = true
    displayLogo = true
    width = "full"
    [params.navbar.logo]
      path = "images/snap-logo.png"
      width = 40
      height = 40

  [params.footer]
    width = "full"
    displayCopyright = false
    displayPoweredBy = false

  [params.search]
    enable = true
    type = "flexsearch"
    [params.search.flexsearch]
      index = "content"
      tokenize = "forward"

  [params.editURL]
    enable = false

  [params.toc]
    enable = true
